[project]
name = "daily-ml-emulator"
version = "0.1.0"
description = "Эмулятор Daily ML: заглушка звена ранжирования активов"
requires-python = ">=3.12"
# Зависимости backend/ сюда сознательно не переносятся: эмулятору не нужны ни БД,
# ни SDK брокера, ни секреты (FR-018). Индекс T-Bank здесь тоже не нужен.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",       # нужен fastapi.testclient
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_ml_emulator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "BLE", "RUF"]
# Документация и сообщения проекта — на русском. Правила «неоднозначных
# юникод-символов» здесь дают только ложные срабатывания на кириллице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:daily_ml_emulator.*"]
