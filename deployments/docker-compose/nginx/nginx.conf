server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Иконки вкладки обслуживаются точными правилами: под SPA-fallback они
    # попадать не должны, иначе браузер получает HTML вместо картинки и молча
    # ничего не показывает.
    location = /favicon.svg {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.ico {
        # Файла нет намеренно: иконка векторная. Пустой ответ лучше HTML.
        return 204;
    }

    # SPA: любой неизвестный путь отдаёт index.html, роутинг на стороне клиента.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Собранные ассеты содержат хеш в имени — кэшируются надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Реверс-прокси на Backend-API.
    # Ответы не кэшируются: возраст данных должен быть честным (FR-014).
    location /api/ {
        proxy_pass http://backend-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;

        # Ручное обновление ходит к брокеру: запас над SC-004 (≤ 5 с в 95% случаев).
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Внутренний REST Backend-Worker наружу не проксируется — он доступен
    # только внутри сети compose.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
