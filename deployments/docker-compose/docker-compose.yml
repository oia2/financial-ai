name: financial-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:-financial_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Проброс наружу нужен для локальных тестов и alembic вне контейнера.
      # POSTGRES_PORT позволяет разойтись с другой локальной PostgreSQL.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial_ai} -d ${POSTGRES_DB:-financial_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-api:
    build:
      context: ../../backend
    # Публичный HTTP API. Токен брокера сюда НЕ передаётся: этот сервис
    # не обращается к T-Bank ни при каких условиях (FR-021, FR-023).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn financial_ai.api.app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-financial_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-financial_ai}
      WORKER_INTERNAL_URL: http://backend-worker:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  backend-worker:
    build:
      context: ../../backend
    # Единственный сервис, которому передаётся токен брокера.
    command: >
      uvicorn financial_ai.worker.app:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-financial_ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-financial_ai}
      TBANK_INVEST_READ_TOKEN: ${TBANK_INVEST_READ_TOKEN:-}
      TBANK_INVEST_TARGET: ${TBANK_INVEST_TARGET:-invest-public-api.tbank.ru:443}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Сбор рыночных данных MOEX. Данные публичны — секретов здесь нет.
      MARKET_DATA_ENABLED: ${MARKET_DATA_ENABLED:-true}
      MARKET_DATA_INGEST_AFTER_CLOSE: ${MARKET_DATA_INGEST_AFTER_CLOSE:-19:30}
      MARKET_DATA_BACKFILL_FROM: ${MARKET_DATA_BACKFILL_FROM:-}
      MARKET_DATA_PRICE_WINDOW_SESSIONS: ${MARKET_DATA_PRICE_WINDOW_SESSIONS:-314}
      MARKET_DATA_GLOBAL_WINDOW_SESSIONS: ${MARKET_DATA_GLOBAL_WINDOW_SESSIONS:-314}
      MARKET_DATA_POSITIONS_WINDOW_SESSIONS: ${MARKET_DATA_POSITIONS_WINDOW_SESSIONS:-82}
      MARKET_DATA_DATASET_ROOT: /datasets
      MARKET_DATA_DATASET_RETENTION_DAYS: ${MARKET_DATA_DATASET_RETENTION_DAYS:-30}
      # Предел восстановления при старте: глубокий разрыв данных чинится
      # управляемым догоном, а не лавиной запросов к бирже при запуске.
      # 0 — без предела: разрыв догоняется на всю глубину окна догона.
      # Положительное число возвращает предел, и разрыв сверх него не собирается вовсе.
      MARKET_DATA_STARTUP_RECOVERY_MAX_SESSIONS: ${MARKET_DATA_STARTUP_RECOVERY_MAX_SESSIONS:-0}
      DAILY_ML_URL: ${DAILY_ML_URL:-http://daily-ml-emulator:8000}
      # Жизненный цикл Daily ML. Обязательные группы данных — перечень, без
      # полноты которого ранжирование не запускается ни при каких условиях.
      DAILY_ML_ENABLED: ${DAILY_ML_ENABLED:-true}
      # Перечень повторяет умолчание из `backend/src/financial_ai/config.py`
      # намеренно: оператор стенда смотрит сюда, а не в код. Дивидендов в
      # нём нет — они не признак модели и запрещены как ex-ante.
      DAILY_ML_REQUIRED_DATA_GROUPS: >-
        ${DAILY_ML_REQUIRED_DATA_GROUPS:-["quotes","aggregates","global","positions","reference"]}
      DAILY_ML_MAX_ATTEMPTS: ${DAILY_ML_MAX_ATTEMPTS:-3}
      DAILY_ML_TICK_SECONDS: ${DAILY_ML_TICK_SECONDS:-60}
    volumes:
      # Неизменяемые наборы входных данных: worker пишет, звено ранжирования
      # читает. Это не хранилище — набор опознан дайджестом и не меняется.
      - datasets:/datasets
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health')"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  daily-ml-emulator:
    build:
      context: ../../daily-ml-emulator
    # Заглушка звена ранжирования активов: позволяет поднимать стенд целиком, пока
    # настоящая модель не подключена. Ни с одним сервисом не связан — ни depends_on,
    # ни общей БД, ни токена брокера. Всё, что он умеет, вымышлено (FR-011, FR-018).
    ports:
      - "${DAILY_ML_EMULATOR_PORT:-8100}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Версия входит в ключ идемпотентности прогона: её меняют вместе с
      # моделью, а не «для порядка».
      DAILY_ML_EMULATOR_MODEL_ID: ${DAILY_ML_EMULATOR_MODEL_ID:-daily-ml-emulator}
      DAILY_ML_EMULATOR_MODEL_VERSION: ${DAILY_ML_EMULATOR_MODEL_VERSION:-emulator-v1}
      # Имитация длительности инференса. Без неё состояние «выполняется» не
      # наблюдаемо: прогон проходит его за миллисекунды.
      DAILY_ML_EMULATOR_LATENCY_SECONDS: ${DAILY_ML_EMULATOR_LATENCY_SECONDS:-2}
    volumes:
      # Только на чтение: набор материализует worker, звено ранжирования его
      # не меняет. Сам эмулятор набор не читает — том смонтирован под будущую
      # настоящую модель, которая встанет на это место.
      - datasets:/datasets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ../../frontend
    # Внутри контейнера работает nginx: отдаёт статику и проксирует /api.
    # Отдельного сервиса nginx нет.
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend-api:
        condition: service_started

volumes:
  postgres-data:
  datasets:
