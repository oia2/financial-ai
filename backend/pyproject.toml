[project]
name = "financial-ai"
version = "0.1.0"
description = "Financial AI backend: Backend-API and Backend-Worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "t-tech-investments==1.49.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_ai"]

# Пакет t-tech-investments отсутствует на публичном PyPI (проект там на карантине
# и не содержит файлов). Единственный источник — GitLab-реестр T-Bank.
# Индекс объявлен explicit: с него ставится только этот пакет, остальные — с PyPI.
[[tool.uv.index]]
name = "tbank"
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
explicit = true

[tool.uv.sources]
t-tech-investments = { index = "tbank" }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "BLE", "RUF"]
# Документация и сообщения проекта — на русском. Правила «неоднозначных
# юникод-символов» здесь дают только ложные срабатывания на кириллице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Доменный слой и адаптер брокера — место, где ломается денежная точность.
# Здесь проверка строгая.
[[tool.mypy.overrides]]
module = ["financial_ai.domain.*", "financial_ai.broker.*"]
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

# У SDK нет type stubs.
[[tool.mypy.overrides]]
module = ["t_tech.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "db: тест требует доступной PostgreSQL (пропускается, если БД недоступна)",
]
filterwarnings = [
    "error::DeprecationWarning:financial_ai.*",
    # SDK объявляет устаревшими поля своих protobuf-схем при импорте.
    "ignore::DeprecationWarning:t_tech.*",
    "ignore:.*GetLastTradesRequest.*:DeprecationWarning",
]
